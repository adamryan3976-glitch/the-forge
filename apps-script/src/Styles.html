<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1d2433;
    --muted: #5b6477;
    --line: #dfe3ec;
    --brand: #2356c9;
    --brand-ink: #ffffff;
    --brand-soft: #e7eefc;
    --good: #1e7d4f;
    --good-soft: #e3f4ea;
    --mid: #9a6200;
    --mid-soft: #fff2d9;
    --bad: #b3261e;
    --bad-soft: #fde7e5;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 16px rgba(20, 30, 60, .06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header.top .brand { font-weight: 700; font-size: 18px; }
  header.top .who { color: var(--muted); font-size: 14px; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 22px; margin-bottom: 18px; }
  h1 { font-size: 26px; margin: 0 0 8px; }
  h2 { font-size: 20px; margin: 0 0 12px; }
  h3 { font-size: 16px; margin: 18px 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  button, .btn { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 10px 16px; cursor: pointer; min-height: 44px; }
  button.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
  button.big { font-size: 20px; padding: 14px 28px; border-radius: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 3px solid #8fb0ff; outline-offset: 2px; }
  select, input, textarea { font: inherit; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--card); color: var(--ink); min-height: 44px; }
  textarea { width: 100%; min-height: 180px; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); }
  .error { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 12px 14px; margin: 10px 0; white-space: pre-line; }
  .ok { background: var(--good-soft); color: var(--good); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .spinner { width: 36px; height: 36px; border: 4px solid var(--brand-soft); border-top-color: var(--brand);
    border-radius: 50%; animation: spin 0.9s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Student quiz ---------- */
  .progress { height: 12px; background: var(--brand-soft); border-radius: 99px; overflow: hidden; margin: 6px 0 18px; }
  .progress > div { height: 100%; background: var(--brand); transition: width .25s; }
  .qnum { color: var(--muted); font-weight: 600; }
  .qtext { font-size: 24px; line-height: 1.4; margin: 10px 0 18px; white-space: pre-wrap; }
  .qimg { display: block; max-width: 100%; max-height: 340px; margin: 0 auto 18px; border-radius: 10px; }
  .options { display: grid; gap: 12px; }
  .option { display: flex; align-items: center; gap: 14px; text-align: left; font-size: 20px; padding: 14px 16px;
    border: 2px solid var(--line); border-radius: 14px; background: var(--card); width: 100%; min-height: 64px; }
  .option .letter { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: var(--brand-soft); color: var(--brand); font-weight: 700; }
  .option .optimg { max-height: 140px; max-width: 70%; border-radius: 8px; background: #fff; }
  .optimg.small { max-height: 60px; max-width: 160px; border-radius: 6px; background: #fff; }
  .option[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
  .option[aria-pressed="true"] .letter { background: var(--brand); color: var(--brand-ink); }
  .navrow { display: flex; gap: 12px; margin-top: 22px; align-items: center; }
  .dots { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .dot { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); font-weight: 600; }
  .dot.answered { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
  .dot.missing { border-color: var(--mid); background: var(--mid-soft); color: var(--mid); }
  .celebrate { font-size: 64px; }

  /* ---------- Staff ---------- */
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .stat .label { color: var(--muted); font-size: 13px; }
  .stat .value { font-size: 28px; font-weight: 700; }
  .stat .value.small { font-size: 18px; line-height: 1.35; }
  .bars { display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: 150px 1fr 170px; gap: 10px; align-items: center; font-size: 14px; }
  .bar > span:last-child { white-space: nowrap; }
  .bar .track { height: 22px; background: #eef1f6; border-radius: 6px; position: relative; overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 6px; }
  .bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,.35); }
  .fill.strength { background: var(--good); } .fill.developing { background: #d99a1c; } .fill.gap { background: var(--bad); }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .pill.strength { background: var(--good-soft); color: var(--good); }
  .pill.developing { background: var(--mid-soft); color: var(--mid); }
  .pill.gap { background: var(--bad-soft); color: var(--bad); }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: #f1f4fa; font-weight: 600; position: sticky; top: 0; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  details summary { cursor: pointer; font-weight: 600; margin: 4px 0; }
  .legend { font-size: 13px; color: var(--muted); }

  /* Forge answer colours */
  .lvlbar { display: flex; height: 18px; border-radius: 5px; overflow: hidden; background: #eef1f6; }
  .lvl.green, .swatch.green { background: #34a853; }
  .lvl.yellow, .swatch.yellow { background: #f6c026; }
  .lvl.orange, .swatch.orange { background: #f28b30; }
  .lvl.red, .swatch.red { background: #d93025; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover, tr.clickable:focus { background: var(--brand-soft); outline: none; }
  dialog.qdetail { width: min(760px, 94vw); max-height: 88vh; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow); color: var(--ink); }
  dialog.qdetail::backdrop { background: rgba(20, 30, 60, .35); }
  .qtext.small { font-size: 17px; margin: 4px 0 10px; }
  .optdetail { border-left: 8px solid #c9ced8; background: #f7f8fb; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  .optdetail.green { border-left-color: #34a853; } .optdetail.yellow { border-left-color: #f6c026; }
  .optdetail.orange { border-left-color: #f28b30; } .optdetail.red { border-left-color: #d93025; }
  .optdetail .names { font-size: 14px; margin-top: 4px; }

  @media (max-width: 640px) {
    .qtext { font-size: 20px; }
    .option { font-size: 18px; }
    .bar { grid-template-columns: 100px 1fr 80px; }
  }
  @media print {
    header.top, .tabs, .no-print, button { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; break-inside: avoid; }
  }
</style>
